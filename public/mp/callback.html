<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Linking Mercado Pago - Moni</title>
    <style>
      body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #fafafa; color: #222; }
      main { text-align: center; padding: 24px; max-width: 360px; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Linking your Mercado Pago account...</h1>
      <p id="detail">Please wait a moment.</p>
    </main>
    <script>
      // Static landing page for the Mercado Pago OAuth redirect. It holds no secrets: it forwards the one-time
      // `code` and `state` plus the user's own Supabase session token (same origin) to mp-oauth-callback.
      // If the stored token already expired (the person spent a while at Mercado Pago) the page never refreshes it
      // (refresh tokens rotate; only the app may use them): it parks code/state in sessionStorage and sends the person
      // back to Moni, which finishes the exchange with its own, refreshed session. Nothing goes into a URL.
      ;(function () {
        var API_BASE_KEY = 'moni.mp.apiBase' // written by the app (same origin) before it leaves for Mercado Pago
        var PENDING_KEY = 'moni.mp.pending'
        var params = new URLSearchParams(window.location.search)
        var code = params.get('code')
        var state = params.get('state')
        // Remove the one-time values from the address bar and history right away.
        window.history.replaceState(null, '', window.location.pathname)

        function done(ok, reason) {
          var target = '/cuentas?mp=' + (ok ? 'ok' : 'error')
          if (!ok && reason) target += '&reason=' + encodeURIComponent(reason)
          window.location.replace(target)
        }
        function fail(reason) {
          document.getElementById('title').textContent = 'We could not link your account'
          document.getElementById('detail').textContent = 'Taking you back to Moni...'
          window.setTimeout(function () { done(false, reason) }, 1200)
        }
        // Lets the app finish the exchange with a fresh session. Without sessionStorage there is nothing to hand over.
        function deferToApp() {
          try {
            window.sessionStorage.setItem(PENDING_KEY, JSON.stringify({ code: code, state: state, at: Date.now() }))
          } catch (e) {
            return fail('session_required')
          }
          window.location.replace('/cuentas?mp=pending')
        }
        // Only an https origin (http for localhost in development); never credentials, never a path.
        function safeBase(value) {
          try {
            var u = new URL(value)
            var local = u.hostname === 'localhost' || u.hostname === '127.0.0.1' || u.hostname === '[::1]'
            if (u.protocol !== 'https:' && !(u.protocol === 'http:' && local)) return null
            if (u.username || u.password) return null
            return u.origin
          } catch (e) {
            return null
          }
        }

        if (params.get('error') || !code || !state) return fail('denied')

        // supabase-js keeps the session under `sb-<project-ref>-auth-token`.
        var ref = null
        var token = null
        var expiresAt = null
        try {
          for (var i = 0; i < window.localStorage.length; i++) {
            var key = window.localStorage.key(i)
            var m = key && /^sb-([a-z0-9]+)-auth-token$/.exec(key)
            if (m) {
              var session = JSON.parse(window.localStorage.getItem(key))
              if (session && typeof session.access_token === 'string') {
                ref = m[1]
                token = session.access_token
                expiresAt = typeof session.expires_at === 'number' ? session.expires_at : null
                break
              }
            }
          }
        } catch (e) {
          // fall through: no session
        }
        if (!ref || !token) return fail('session_required')
        if (expiresAt !== null && expiresAt * 1000 <= Date.now() + 10000) return deferToApp()

        // API base: the value the app stored (works with local Supabase and custom auth domains); the hosted
        // project URL derived from the key name is only the fallback.
        var base = safeBase(window.localStorage.getItem(API_BASE_KEY)) || 'https://' + ref + '.supabase.co'

        fetch(base + '/functions/v1/mp-oauth-callback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
          body: JSON.stringify({ code: code, state: state }),
        })
          .then(function (res) {
            return res.json().catch(function () { return {} }).then(function (body) {
              if (res.ok) return done(true)
              // A rejected token (the state was NOT consumed): let the app retry with a refreshed session.
              if (res.status === 401) return deferToApp()
              fail(typeof body.error === 'string' ? body.error : 'error')
            })
          })
          .catch(function () { fail('network') })
      })()
    </script>
  </body>
</html>
