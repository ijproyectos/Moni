# Minimal local configuration. Regenerate with `supabase init` once the CLI is installed.
project_id = "moni"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback"]
enable_signup = true

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

[functions.parse-movements]
enabled = true
verify_jwt = true
entrypoint = "./functions/parse-movements/index.ts"

[functions.parse-receipt]
enabled = true
verify_jwt = true
entrypoint = "./functions/parse-receipt/index.ts"

[functions.insights-chat]
enabled = true
verify_jwt = true
entrypoint = "./functions/insights-chat/index.ts"

[functions.plus-subscription]
enabled = true
verify_jwt = true
entrypoint = "./functions/plus-subscription/index.ts"

# verify_jwt is OFF on purpose: Mercado Pago calls this URL server-to-server and has no Supabase JWT. The request is
# authenticated by the HMAC-SHA256 `x-signature` header (MP_WEBHOOK_SECRET), which the function checks before doing
# any database or Mercado Pago API work.
[functions.mp-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/mp-webhook/index.ts"

[functions.mp-oauth]
enabled = true
verify_jwt = true
entrypoint = "./functions/mp-oauth/index.ts"

# verify_jwt is OFF on purpose: public/mp/callback.html may reach this function without a usable session. The function
# requires a session JWT itself (session_required otherwise) and a single-use state bound to that user.
[functions.mp-oauth-callback]
enabled = true
verify_jwt = false
entrypoint = "./functions/mp-oauth-callback/index.ts"

# verify_jwt is OFF on purpose: pg_cron (via pg_net) and mp-oauth `sync` call this function server-to-server with no
# user JWT. The function compares the `x-moni-cron-secret` header with its Edge secret (constant time) before any
# database or Mercado Pago work.
[functions.mp-sync]
enabled = true
verify_jwt = false
entrypoint = "./functions/mp-sync/index.ts"

# verify_jwt is OFF on purpose: Mercado Pago calls this URL without a Supabase JWT. The HMAC `x-signature` is checked
# before any database work, and the function stays inert (200 ignored:disabled) until MP_CONNECT_WEBHOOK_ENABLED is
# 'true' (only after task 0.3 verified the mp-connect payload and manifest).
[functions.mp-connect-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/mp-connect-webhook/index.ts"
