# Minimal local configuration. Regenerate with `supabase init` once the CLI is installed.
project_id = "moni"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback"]
enable_signup = true

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

[functions.parse-movements]
enabled = true
verify_jwt = true
entrypoint = "./functions/parse-movements/index.ts"

[functions.parse-receipt]
enabled = true
verify_jwt = true
entrypoint = "./functions/parse-receipt/index.ts"
